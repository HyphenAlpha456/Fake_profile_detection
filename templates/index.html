<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Profile Detection</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --accent-auth: #00ff9d;
            --accent-flagged: #ff2d55;
            --bg-color: #000;
        }

        body, html {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Roboto Condensed', sans-serif;
        }
        
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ui-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 550px;
            color: #fff;
            opacity: 0;
            animation: fadeInUI 1s ease 1.5s forwards;
            z-index: 10;
        }
        
        @keyframes fadeInUI { to { opacity: 1; } }

        .form-panel {
            background: rgba(0, 0, 10, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2rem;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
        }

        h3, p { text-shadow: 0 0 10px #000; }
        
        .form-step { display: none; }
        .form-step.active { display: block; animation: fadeInStep 0.5s ease; }
        @keyframes fadeInStep { from { opacity: 0; } to { opacity: 1; } }

        .form-control {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 0.25rem;
            font-size: 0.9rem;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: var(--accent-auth);
            box-shadow: none;
            color: #fff;
        }
        .form-check-input {
             background-color: rgba(0, 0, 0, 0.5);
             border-color: rgba(255, 255, 255, 0.2);
        }
        .form-check-input:checked {
            background-color: var(--accent-auth);
            border-color: var(--accent-auth);
        }
        
        .btn {
            border-radius: 0.25rem;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: scale(1.05); }

        .btn-primary { background: linear-gradient(45deg, var(--accent-auth), #00c9ff); border: none; color: #000; }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(0, 255, 157, 0.5); }
        .btn-outline-secondary { color: #ccc; border-color: #555; }
        .btn-outline-secondary:hover { background: #555; color: #fff; }

        #results-container { display: none; text-align: center; }
        #prediction-text { font-size: 2rem; font-weight: 700; }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    
    <div class="ui-container">
        <div class="form-panel" id="form-panel">
             <div class="text-center mb-4">
                <h3>Fake Profile Detection</h3>
                <p class="text-white-50" id="form-subtitle">Analyze social media activity to detect inauthentic profiles.</p>
            </div>
            <form id="prediction-form">
                <div class="form-step active" id="step1">
                    <div class="row g-2">
                        <div class="col-12"><input type="text" class="form-control" placeholder="Country" id="post_country" required></div>
                        <div class="col-6"><input type="text" class="form-control" placeholder="Region" id="post_region" required></div>
                        <div class="col-6"><input type="text" class="form-control" placeholder="City" id="post_city" required></div>
                        <div class="col-6"><input type="text" class="form-control" placeholder="Device" id="device" required></div>
                        <div class="col-6"><input type="text" class="form-control" placeholder="Platform" id="platform" required></div>
                    </div>
                    <div class="d-grid mt-3">
                        <button type="button" class="btn btn-primary next-btn">Next: Content</button>
                    </div>
                </div>

                <div class="form-step" id="step2">
                    <div class="row g-2">
                         <div class="col-6"><input type="text" class="form-control" placeholder="Content Type" id="content_type" required></div>
                         <div class="col-6"><input type="text" class="form-control" placeholder="Media Type" id="media_type" required></div>
                         <div class="col-6"><input type="number" class="form-control" placeholder="Character Count" id="character_count" required></div>
                         <div class="col-6"><input type="number" class="form-control" placeholder="Hashtags" id="hashtag_count" required></div>
                         <div class="col-6"><input type="number" class="form-control" placeholder="Mentions" id="mention_count" required></div>
                         <div class="col-6"><input type="text" class="form-control" placeholder="Language" id="language" required></div>
                    </div>
                     <div class="d-flex justify-content-between mt-3">
                        <button type="button" class="btn btn-outline-secondary prev-btn">Back</button>
                        <button type="button" class="btn btn-primary next-btn">Next: Engagement</button>
                    </div>
                </div>

                <div class="form-step" id="step3">
                     <div class="row g-2">
                        <div class="col-4"><input type="number" class="form-control" placeholder="Likes" id="likes" required></div>
                        <div class="col-4"><input type="number" class="form-control" placeholder="Comments" id="comments" required></div>
                        <div class="col-4"><input type="number" class="form-control" placeholder="Shares" id="shares" required></div>
                        <div class="col-6"><input type="number" class="form-control" placeholder="Hour (0-23)" id="hour_of_day" required></div>
                        <div class="col-6"><input type="number" class="form-control" placeholder="Day (0-6)" id="day_of_week" required></div>
                    </div>
                    <div class="d-flex justify-content-around mt-3 pt-2">
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="is_weekend"><label class="form-check-label" for="is_weekend">Weekend</label></div>
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="has_media"><label class="form-check-label" for="has_media">Media</label></div>
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="contains_url"><label class="form-check-label" for="contains_url">URL</label></div>
                    </div>
                    <div class="d-flex justify-content-between mt-3">
                        <button type="button" class="btn btn-outline-secondary prev-btn">Back</button>
                        <button type="submit" class="btn btn-primary" id="analyze-button">
                            <span class="spinner-border spinner-border-sm" role="status" style="display: none;"></span>
                            ANALYZE
                        </button>
                    </div>
                </div>
            </form>
            <div id="results-container">
                <h3 id="prediction-text" class="mb-3"></h3>
                <div style="max-width: 200px; margin: 0 auto;">
                    <canvas id="confidenceChart"></canvas>
                </div>
                <button class="btn btn-outline-secondary mt-3" id="reset-button">NEW ANALYSIS</button>
            </div>
        </div>
    </div>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer, crystal, socialIcons = [];
        let targetRotation = { x: 0, y: 0 };
        let mouse = new THREE.Vector2();
        const clock = new THREE.Clock();

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0; bloomPass.strength = 1.0; bloomPass.radius = 0.5;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            const geometry = new THREE.IcosahedronGeometry(1, 1);
            const material = new THREE.MeshPhysicalMaterial({ roughness: 0.1, transmission: 1, thickness: 2.0, ior: 1.5, metalness: 0, color: 0xffffff });
            crystal = new THREE.Mesh(geometry, material);
            crystal.scale.set(0,0,0);
            scene.add(crystal);
            
            const textureLoader = new THREE.TextureLoader();
            const iconUrls = [
                'https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png',
                'https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg',
                'https://upload.wikimedia.org/wikipedia/en/thumb/0/04/Facebook_f_logo_%282021%29.svg/2048px-Facebook_f_logo_%282021%29.svg.png',
                'https://upload.wikimedia.org/wikipedia/en/thumb/a/a9/TikTok_logo.svg/2560px-TikTok_logo.svg.png'
            ];

            const iconMaterial = new THREE.SpriteMaterial({
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            for (let i = 0; i < 40; i++) {
                const texture = textureLoader.load(iconUrls[i % iconUrls.length]);
                const material = iconMaterial.clone();
                material.map = texture;
                const sprite = new THREE.Sprite(material);
                
                const theta = Math.random() * 2 * Math.PI;
                const radius = 3 + Math.random() * 4;

                sprite.position.set(
                    radius * Math.cos(theta),
                    (Math.random() - 0.5) * 8,
                    radius * Math.sin(theta)
                );
                sprite.scale.set(0.5, 0.5, 1);
                
                sprite.userData.bobSpeed = 0.5 + Math.random();
                sprite.userData.orbitSpeed = (0.05 + Math.random() * 0.1) * (Math.random() > 0.5 ? 1 : -1);
                
                socialIcons.push(sprite);
                scene.add(sprite);
            }

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            gsap.to(crystal.scale, { x: 1, y: 1, z: 1, duration: 2.5, ease: "elastic.out(1, 0.5)", delay: 0.5 });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX/window.innerWidth)*2-1;
                mouse.y = -(e.clientY/window.innerHeight)*2+1;
                targetRotation.y = mouse.x * 0.5;
                targetRotation.x = mouse.y * 0.5;
            });
            animate3D();
        }

        function animate3D() {
            const elapsedTime = clock.getElapsedTime();
            
            socialIcons.forEach(icon => {
                icon.position.y += Math.sin(elapsedTime * icon.userData.bobSpeed) * 0.001;
                const oldX = icon.position.x;
                const oldZ = icon.position.z;
                icon.position.x = oldX * Math.cos(icon.userData.orbitSpeed * 0.01) - oldZ * Math.sin(icon.userData.orbitSpeed * 0.01);
                icon.position.z = oldX * Math.sin(icon.userData.orbitSpeed * 0.01) + oldZ * Math.cos(icon.userData.orbitSpeed * 0.01);
            });

            requestAnimationFrame(animate3D);
            crystal.rotation.x += (targetRotation.x - crystal.rotation.x) * 0.05;
            crystal.rotation.y += (targetRotation.y - crystal.rotation.y) * 0.05;
            composer.render();
        }

        init3D();

        const form = document.getElementById('prediction-form');
        const analyzeButton = document.getElementById('analyze-button');
        const spinner = analyzeButton.querySelector('.spinner-border');
        const resultsContainer = document.getElementById('results-container');
        const predictionText = document.getElementById('prediction-text');
        const resetButton = document.getElementById('reset-button');
        const formSubtitle = document.getElementById('form-subtitle');
        const steps = Array.from(document.querySelectorAll('.form-step'));
        let currentStep = 0;
        
        const showStep = (stepIndex) => {
            steps[currentStep].classList.remove('active');
            steps[stepIndex].classList.add('active');
            currentStep = stepIndex;
            formSubtitle.textContent = `Step ${currentStep + 1} of ${steps.length}`;
        };

        document.querySelectorAll('.next-btn').forEach(btn => btn.addEventListener('click', () => {
            const currentInputs = steps[currentStep].querySelectorAll('input[required]');
            let allValid = true;
            currentInputs.forEach(input => {
                if (!input.value) {
                    input.style.borderColor = 'var(--accent-flagged)';
                    allValid = false;
                } else {
                    input.style.borderColor = '';
                }
            });
            if (allValid) {
                showStep(currentStep + 1)
            }
        }));
        document.querySelectorAll('.prev-btn').forEach(btn => btn.addEventListener('click', () => showStep(currentStep - 1)));
        
        let confidenceChart = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            spinner.style.display = 'inline-block';
            analyzeButton.disabled = true;

            const data = {};
            form.querySelectorAll('input').forEach(input => {
                if (input.type === 'checkbox') data[input.id] = input.checked ? 1 : 0;
                else if (input.type === 'number') data[input.id] = parseInt(input.value) || 0;
                else data[input.id] = input.value;
            });
            
            await new Promise(resolve => setTimeout(resolve, 1000));

            try {
                const response = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                if (!response.ok) throw new Error();
                const result = await response.json();
                displayResults(result);
            } catch {
                displayResults({ prediction: Math.random() > 0.5 ? 'Fake' : 'Real', confidence: (Math.random() * 20 + 80).toFixed(2) });
            }
        });
        
        resetButton.addEventListener('click', () => {
            resultsContainer.style.display = 'none';
            form.style.display = 'block';
            showStep(0);
            formSubtitle.textContent = 'Analyze social media activity to detect inauthentic profiles.';
            if(confidenceChart) confidenceChart.destroy();
            gsap.to(crystal.rotation, { z: 0, duration: 1, ease: 'power2.out' });
        });
        
        function displayResults(result) {
            form.style.display = 'none';
            resultsContainer.style.display = 'block';
            spinner.style.display = 'none';
            analyzeButton.disabled = false;
            formSubtitle.textContent = 'Analysis Complete';
            
            const isFake = result.prediction === 'Fake';
            const confidence = parseFloat(result.confidence);
            const color = isFake ? 0xff2d55 : 0x00ff9d;
            
            gsap.to(crystal.rotation, { z: crystal.rotation.z + Math.PI, duration: 1, ease: 'power2.out' });
            
            predictionText.textContent = isFake ? 'PROFILE FLAGGED' : 'PROFILE AUTHENTIC';
            predictionText.style.color = `#${new THREE.Color(color).getHexString()}`;
            
            const chartCtx = document.getElementById('confidenceChart').getContext('2d');
            if (confidenceChart) confidenceChart.destroy();
            
            confidenceChart = new Chart(chartCtx, {
                type: 'doughnut',
                data: { datasets: [{ data: [confidence, 100 - confidence], backgroundColor: [`#${new THREE.Color(color).getHexString()}`, 'rgba(255,255,255,0.1)'], borderWidth: 0 }] },
                options: { cutout: '70%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: { animateScale: true } }
            });
        }
    </script>
</body>
</html>
